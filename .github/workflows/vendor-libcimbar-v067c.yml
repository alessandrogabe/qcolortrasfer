name: Vendor libcimbar v0.6.7c

on:
  push:
    branches:
      - v3-4-libcimbar-wasm-engine
    paths:
      - '.github/workflows/vendor-libcimbar-v067c.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-4-libcimbar-wasm-engine
          fetch-depth: 0
      - name: Download and verify official release
        shell: bash
        run: |
          set -euo pipefail
          VERSION='v0.6.7c'
          ARCHIVE="$RUNNER_TEMP/cimbar.wasm.tar.gz"
          URL="https://github.com/sz3/libcimbar/releases/download/${VERSION}/cimbar.wasm.tar.gz"
          curl -L --fail --retry 3 -o "$ARCHIVE" "$URL"
          echo '776a8d71c8bc782eda769c4c0b309d805ca13cbd78df0ed0373cfa9ac44ef20e  '"$ARCHIVE" | sha256sum -c -
          rm -rf vendor/libcimbar/v0.6.7c
          mkdir -p vendor/libcimbar/v0.6.7c
          tar -xzf "$ARCHIVE" -C vendor/libcimbar/v0.6.7c
          curl -L --fail -o vendor/libcimbar/LICENSE-MPL-2.0.txt \
            https://raw.githubusercontent.com/sz3/libcimbar/v0.6.7c/LICENSE
          cat > vendor/libcimbar/SOURCE-NOTICE.md <<'EOF'
          # libcimbar vendored runtime

          qcolortrasfer includes the official libcimbar Web/WASM release artifact solely for the optional `CIMBAR ENGINE EXP` mode.

          - Upstream: `sz3/libcimbar`
          - Version/tag: `v0.6.7c`
          - Upstream release commit: `e5bebd0`
          - Artifact: `cimbar.wasm.tar.gz`
          - Artifact SHA-256: `776a8d71c8bc782eda769c4c0b309d805ca13cbd78df0ed0373cfa9ac44ef20e`
          - Upstream source: https://github.com/sz3/libcimbar/tree/v0.6.7c
          - License: Mozilla Public License 2.0 for libcimbar files. See `LICENSE-MPL-2.0.txt`.

          The surrounding qcolortrasfer adapter and application files remain separately licensed under MIT. No libcimbar source file is relicensed as MIT.
          EOF
      - name: Commit vendored runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/libcimbar
          git commit -m 'vendor: add official libcimbar v0.6.7c wasm runtime'
          git push origin HEAD:v3-4-libcimbar-wasm-engine
