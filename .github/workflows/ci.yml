name: qcolortrasfer CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and regression tests
        run: npm test
      - name: Syntax and full checks
        run: npm run check
